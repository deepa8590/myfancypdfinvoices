<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p>Hello 
    <span th:text="${username}" th:remove:"tag">[Username]</span>,
    This is the current date and time: 
    <span th:text="${#temporals.format(currentDateTime, 'yyyy-MM-dd HH:mm:ss')}" th:remove:"tag">[CurrentDateTime]</span>
</p>
<div th:if="${username.startsWith('z')}">Your name starts with a lower-case z, unusual!</div>
</body>
</html>
